
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Todo App</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
}

.todo-app {
    width: 100%;
    max-width: 420px;
    padding: 30px;
    border-radius: 24px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
}

h1 {
    color: white;
    text-align: center;
    margin-bottom: 8px;
    font-size: 30px;
}

.subtitle {
    text-align: center;
    color: #f3eaff;
    margin-bottom: 25px;
    font-size: 14px;
}

.input-box {
    display: flex;
    gap: 8px;
    margin-bottom: 22px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: none;
    outline: none;
    border-radius: 12px;
    font-size: 14px;
    background: rgba(255, 255, 255, 0.95);
}

button {
    border: none;
    cursor: pointer;
    border-radius: 12px;
    font-weight: bold;
    transition: 0.2s;
}

.add-btn {
    padding: 12px 16px;
    color: white;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

button:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
}

#task-count {
    color: white;
    font-size: 14px;
    margin-bottom: 12px;
}

ul {
    list-style: none;
}

li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px;
    margin-bottom: 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    color: #333;
    animation: appear 0.25s ease;
}

li span {
    flex: 1;
    overflow-wrap: anywhere;
}

li.completed span {
    text-decoration: line-through;
    color: #999;
}

li input[type="checkbox"] {
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    accent-color: #764ba2;
    cursor: pointer;
}

.delete-btn {
    padding: 7px 10px;
    color: white;
    background: linear-gradient(135deg, #ff5858, #f09819);
}

.empty {
    text-align: center;
    color: white;
    padding: 18px 0;
    font-size: 14px;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(8px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 400px) {
    .todo-app {
        padding: 22px;
    }

    h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="todo-app">
    <h1>✨ My Todo List</h1>
    <p class="subtitle">Make today productive!</p>

    <div class="input-box">
        <input
            type="text"
            id="task-input"
            placeholder="Add a new task..."
            aria-label="New task"
        >
        <button class="add-btn" onclick="addTask()">+ Add</button>
    </div>

    <p id="task-count">0 tasks remaining</p>

    <ul id="task-list"></ul>
    <p class="empty" id="empty-message">No tasks yet. Add one! 🌈</p>
</div>

<script>
const input = document.getElementById("task-input");
const list = document.getElementById("task-list");
const count = document.getElementById("task-count");
const emptyMessage = document.getElementById("empty-message");

function addTask() {
    const taskText = input.value.trim();

    if (taskText === "") {
        input.focus();
        return;
    }

    const li = document.createElement("li");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.setAttribute("aria-label", "Mark task as completed");

    const span = document.createElement("span");
    span.textContent = taskText;

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "✕";
    deleteBtn.className = "delete-btn";
    deleteBtn.setAttribute("aria-label", "Delete task");

    checkbox.addEventListener("change", () => {
        li.classList.toggle("completed", checkbox.checked);
        updateCount();
    });

    deleteBtn.addEventListener("click", () => {
        li.remove();
        updateCount();
    });

    li.append(checkbox, span, deleteBtn);
    list.appendChild(li);

    input.value = "";
    input.focus();
    updateCount();
}

function updateCount() {
    const tasks = list.querySelectorAll("li");
    const completed = list.querySelectorAll(
        "li.completed"
    ).length;

    count.textContent =
        `${tasks.length - completed} tasks remaining`;

    emptyMessage.style.display =
        tasks.length === 0 ? "block" : "none";
}

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
        addTask();
    }
});
</script>

</body>
</html>
